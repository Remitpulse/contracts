name: RemitPulse contracts
on: [push, pull_request, workflow_dispatch]

# The workflow only reads source code and uploads build artifacts.
permissions:
  contents: read

# Keep only the newest run for a branch or pull request.
concurrency:
  group: contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32v1-none
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked --release --target wasm32v1-none
      - run: bash -n deploy.sh scripts/build.sh
      - run: python3 -m unittest discover -s tests -v
      - run: cargo test -p remitpulse-account --locked --features wasm-tests
      - name: Record WASM checksums
        run: sha256sum target/wasm32v1-none/release/remitpulse_*.wasm > target/wasm32v1-none/release/SHA256SUMS
      - name: Record WASM provenance
        run: |
          set -euo pipefail
          RUSTC_VERSION="$(rustc --version)"
          SHA256SUMS_HASH="$(sha256sum target/wasm32v1-none/release/SHA256SUMS | awk '{print $1}')"
          cat > target/wasm32v1-none/release/provenance.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "rustc_version": "${RUSTC_VERSION}",
            "target": "wasm32v1-none",
            "sha256sums_sha256": "${SHA256SUMS_HASH}"
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: remitpulse-contracts-${{ github.sha }}-wasm32v1-none
          path: |
            target/wasm32v1-none/release/remitpulse_*.wasm
            target/wasm32v1-none/release/SHA256SUMS
            target/wasm32v1-none/release/provenance.json
          if-no-files-found: error
          retention-days: 30

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --no-deps keeps lint output scoped to repository code; -D warnings fails on any project warning.
      - run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Any exclusions must be narrowly scoped inline `# shellcheck disable=` directives in the scripts.
      - name: Run ShellCheck
        run: shellcheck deploy.sh scripts/build.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Scans Cargo.lock. Documented, time-bounded exceptions belong in .cargo/audit.toml (ignore list).
      - name: Run cargo audit
        run: cargo audit --file Cargo.lock

  reproducible-build:
    name: reproducible-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build release WASM (build A)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build-a
        run: cargo build --workspace --locked --release --target wasm32v1-none
      - name: Build release WASM (build B)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/build-b
        run: cargo build --workspace --locked --release --target wasm32v1-none
      - name: Compute checksums (build A)
        run: |
          set -euo pipefail
          out=build-a/wasm32v1-none/release
          shopt -s nullglob
          files=("$out"/remitpulse_*.wasm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No remitpulse_*.wasm artifacts found in $out"
            exit 1
          fi
          : > build-a-checksums.txt
          for f in "${files[@]}"; do
            sha256sum "$f" | sed "s|$out/||" >> build-a-checksums.txt
          done
          sort -k2 build-a-checksums.txt -o build-a-checksums.txt
          echo "Build A artifacts:"
          cat build-a-checksums.txt
      - name: Compute checksums (build B)
        run: |
          set -euo pipefail
          out=build-b/wasm32v1-none/release
          shopt -s nullglob
          files=("$out"/remitpulse_*.wasm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No remitpulse_*.wasm artifacts found in $out"
            exit 1
          fi
          : > build-b-checksums.txt
          for f in "${files[@]}"; do
            sha256sum "$f" | sed "s|$out/||" >> build-b-checksums.txt
          done
          sort -k2 build-b-checksums.txt -o build-b-checksums.txt
          echo "Build B artifacts:"
          cat build-b-checksums.txt
      - name: Compare checksums
        run: |
          set -euo pipefail
          if diff -u build-a-checksums.txt build-b-checksums.txt > checksum-diff.txt; then
            echo "Reproducible build verified: all remitpulse WASM artifacts match."
            cat build-a-checksums.txt
          else
            echo "::error::Reproducible build check failed: WASM checksums differ between build A and build B."
            echo "--- Artifact checksum diff (build A vs build B) ---"
            cat checksum-diff.txt
            echo "--------------------------------------------------"
            exit 1
          fi
      - name: Upload checksum diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: remitpulse-reproducible-build-${{ github.sha }}
          path: |
            build-a-checksums.txt
            build-b-checksums.txt
            checksum-diff.txt
          if-no-files-found: warn
          retention-days: 30
