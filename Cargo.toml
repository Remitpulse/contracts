[workspace]
resolver = "2"
members = ["contracts/*", "crates/*"]
exclude = ["target"]

[workspace.dependencies]
soroban-sdk = "=22.0.11"
# OpenZeppelin v0.3.0: immutable revision; no SDK/crypto API migration.
stellar-fungible = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }
stellar-ownable = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }
stellar-crypto = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }
stellar-merkle-distributor = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }
stellar-default-impl-macro = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }
stellar-non-fungible = { git = "https://github.com/OpenZeppelin/stellar-contracts", rev = "659fcabdc0e4712254dfebe4f45efd54f49826e9" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
