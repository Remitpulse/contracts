[package]
name = "remitpulse-webauthn"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

remitpulse-webauthn-verifier = { path = "../../crates/webauthn-verifier" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
